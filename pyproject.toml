[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "UP"]
ignore = ["F821"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
